name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  get_version:
    name: Get version
    runs-on: ubuntu-latest
    steps:
      - id: set_output
        run: echo ::set-output name=version::${GITHUB_REF#refs/tags/v}
    outputs:
      version: ${{ steps.set_output.outputs.version }}
  test:
    name: Run tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true
      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build
      - run: go generate github.com/majd/ipa-downloader/...
      - run: go test -v github.com/majd/ipa-downloader/...
  build:
    name: Build
    runs-on: macos-latest
    needs: [get_version, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true
      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build
      - run: go build -ldflags="-X github.com/majd/ipa-downloader/v2/pkg/version.Version=$VERSION -X github.com/majd/ipa-downloader/v2/pkg/version.Commit=$GITHUB_SHA -X 'github.com/majd/ipa-downloader/v2/pkg/version.BuildDate=$(date)'" -o ipa-downloader-windows-amd64.exe
        env:
          GOOS: windows
          GOARCH: amd64
          VERSION: ${{ needs.get_version.outputs.version }}
      - run: go build -ldflags="-X github.com/majd/ipa-downloader/v2/pkg/version.Version=$VERSION -X github.com/majd/ipa-downloader/v2/pkg/version.Commit=$GITHUB_SHA -X 'github.com/majd/ipa-downloader/v2/pkg/version.BuildDate=$(date)'" -o ipa-downloader-windows-arm64.exe
        env:
          GOOS: windows
          GOARCH: arm64
          VERSION: ${{ needs.get_version.outputs.version }}
      - run: go build -ldflags="-X github.com/majd/ipa-downloader/v2/pkg/version.Version=$VERSION -X github.com/majd/ipa-downloader/v2/pkg/version.Commit=$GITHUB_SHA -X 'github.com/majd/ipa-downloader/v2/pkg/version.BuildDate=$(date)'" -o ipa-downloader-macos-arm64
        env:
          GOOS: darwin
          GOARCH: arm64
          VERSION: ${{ needs.get_version.outputs.version }}
          CGO_ENABLED: 1
          CGO_CFLAGS: -mmacosx-version-min=10.15
          CGO_LDFLAGS: -mmacosx-version-min=10.15
      - run: go build -ldflags="-X github.com/majd/ipa-downloader/v2/pkg/version.Version=$VERSION -X github.com/majd/ipa-downloader/v2/pkg/version.Commit=$GITHUB_SHA -X 'github.com/majd/ipa-downloader/v2/pkg/version.BuildDate=$(date)'" -o ipa-downloader-macos-amd64
        env:
          GOOS: darwin
          GOARCH: amd64
          VERSION: ${{ needs.get_version.outputs.version }}
          CGO_ENABLED: 1
          CGO_CFLAGS: -mmacosx-version-min=10.15
          CGO_LDFLAGS: -mmacosx-version-min=10.15
      - uses: actions/upload-artifact@v4
        with:
          name: ipa-downloader-${{ needs.get_version.outputs.version }}-windows-arm64.exe
          path: ipa-downloader-windows-arm64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ipa-downloader-${{ needs.get_version.outputs.version }}-windows-amd64.exe
          path: ipa-downloader-windows-amd64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ipa-downloader-${{ needs.get_version.outputs.version }}-macos-arm64
          path: ipa-downloader-macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: ipa-downloader-${{ needs.get_version.outputs.version }}-macos-amd64
          path: ipa-downloader-macos-amd64
  build_linux:
    name: Build for Linux
    runs-on: ${{ matrix.runner }}
    needs: [get_version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true
      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build
      - run: go build -ldflags="-X github.com/majd/ipa-downloader/v2/pkg/version.Version=$VERSION -X github.com/majd/ipa-downloader/v2/pkg/version.Commit=$GITHUB_SHA -X 'github.com/majd/ipa-downloader/v2/pkg/version.BuildDate=$(date)'" -o ipa-downloader-linux-$GOARCH
        env:
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.get_version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: ipa-downloader-${{ needs.get_version.outputs.version }}-linux-${{ matrix.arch }}
          path: ipa-downloader-linux-${{ matrix.arch }}

  release_windows:
    name: Release for Windows
    runs-on: ubuntu-latest
    needs: [get_version, build]
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ipa-downloader-${{ needs.get_version.outputs.version }}-windows-${{ matrix.arch }}.exe
          path: bin
      - run: tar -czvf $FILE.tar.gz bin/$FILE.exe
        env:
          FILE: ipa-downloader-${{ needs.get_version.outputs.version }}-windows-${{ matrix.arch }}
      - run: ./tools/sha256sum.sh $TARBALL > $TARBALL.sha256sum
        env:
          TARBALL: ipa-downloader-${{ needs.get_version.outputs.version }}-windows-${{ matrix.arch }}.tar.gz
      - uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ipa-downloader-${{ needs.get_version.outputs.version }}-windows-${{ matrix.arch }}.*
          tag: ${{ github.ref }}
          overwrite: false
          file_glob: true
  release_linux:
    name: Release for Linux
    runs-on: ubuntu-latest
    needs: [get_version, build_linux, release_windows]
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ipa-downloader-${{ needs.get_version.outputs.version }}-linux-${{ matrix.arch }}
          path: bin
      - run: chmod +x bin/$FILE && tar -czvf $FILE.tar.gz bin/$FILE
        env:
          FILE: ipa-downloader-${{ needs.get_version.outputs.version }}-linux-${{ matrix.arch }}
      - run: ./tools/sha256sum.sh $TARBALL > $TARBALL.sha256sum
        env:
          TARBALL: ipa-downloader-${{ needs.get_version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz
      - uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ipa-downloader-${{ needs.get_version.outputs.version }}-linux-${{ matrix.arch }}.*
          tag: ${{ github.ref }}
          overwrite: false
          file_glob: true
  release_macos:
    name: Release for macOS
    runs-on: ubuntu-latest
    needs: [get_version, build, build_linux, release_windows, release_linux]
    steps:
      - uses: actions/checkout@v4
        with:
          path: ./ipa-downloader
      - uses: actions/download-artifact@v4
        with:
          name: ipa-downloader-${{ needs.get_version.outputs.version }}-macos-arm64
          path: bin
      - run: chmod +x bin/$BIN && tar -czvf $BIN.tar.gz bin/$BIN && rm -rf bin/
        env:
          BIN: ipa-downloader-${{ needs.get_version.outputs.version }}-macos-arm64
      - uses: actions/download-artifact@v4
        with:
          name: ipa-downloader-${{ needs.get_version.outputs.version }}-macos-amd64
          path: bin
      - run: chmod +x bin/$FILE && tar -czvf $FILE.tar.gz bin/$FILE && rm -rf bin/
        env:
          FILE: ipa-downloader-${{ needs.get_version.outputs.version }}-macos-amd64
      - id: sha256
        run: |
          SHA256_ARM64=$(./ipa-downloader/tools/sha256sum.sh ipa-downloader-${{ needs.get_version.outputs.version }}-macos-arm64.tar.gz)
          SHA256_AMD64=$(./ipa-downloader/tools/sha256sum.sh ipa-downloader-${{ needs.get_version.outputs.version }}-macos-amd64.tar.gz)
          echo $SHA256_ARM64 > ipa-downloader-${{ needs.get_version.outputs.version }}-macos-arm64.tar.gz.sha256sum
          echo $SHA256_AMD64 > ipa-downloader-${{ needs.get_version.outputs.version }}-macos-amd64.tar.gz.sha256sum
          echo ::set-output name=sha256_arm64::$SHA256_ARM64
          echo ::set-output name=sha256_amd64::$SHA256_AMD64
      - uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ipa-downloader-${{ needs.get_version.outputs.version }}-macos-*
          tag: ${{ github.ref }}
          overwrite: false
          file_glob: true
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.HOMEBREW_REPO }}
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          path: homebrew-repo
      - run: |
          cd homebrew-repo
          sed -i "3s/.*/    sha256 \"$SHA256_ARM64\"/" Casks/ipa-downloader.rb
          sed -i "4s/.*/    url \"https:\/\/github.com\/majd\/ipa-downloader\/releases\/download\/v${{ needs.get_version.outputs.version }}\/ipa-downloader-${{ needs.get_version.outputs.version }}-macos-arm64.tar.gz\"/" Casks/ipa-downloader.rb
          sed -i "5s/.*/    binary \"bin\/ipa-downloader-${{ needs.get_version.outputs.version }}-macos-arm64\", target: \"ipa-downloader\"/" Casks/ipa-downloader.rb
          sed -i "7s/.*/    sha256 \"$SHA256_AMD64\"/" Casks/ipa-downloader.rb
          sed -i "8s/.*/    url \"https:\/\/github.com\/majd\/ipa-downloader\/releases\/download\/v${{ needs.get_version.outputs.version }}\/ipa-downloader-${{ needs.get_version.outputs.version }}-macos-amd64.tar.gz\"/" Casks/ipa-downloader.rb
          sed -i "9s/.*/    binary \"bin\/ipa-downloader-${{ needs.get_version.outputs.version }}-macos-amd64\", target: \"ipa-downloader\"/" Casks/ipa-downloader.rb
          sed -i "12s/.*/  version \"${{ needs.get_version.outputs.version }}\"/" Casks/ipa-downloader.rb
          git config --local user.name ${{ secrets.GH_NAME }}
          git config --local user.email ${{ secrets.GH_EMAIL }}
          git add Casks/ipa-downloader.rb
          git commit -m "Update ipa-downloader to v${{ needs.get_version.outputs.version }}"
          git push "https://${{ secrets.GH_TOKEN }}@github.com/${{ secrets.HOMEBREW_REPO }}.git" --set-upstream "main"
        env:
          SHA256_ARM64: ${{ steps.sha256.outputs.sha256_arm64 }}
          SHA256_AMD64: ${{ steps.sha256.outputs.sha256_amd64 }}
