name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  get_version:
    name: Get version
    runs-on: ubuntu-latest
    steps:
      - id: set_output
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION"
    outputs:
      version: ${{ steps.set_output.outputs.version }}

  build-windows:
    name: Build for Windows
    runs-on: windows-latest
    needs: get_version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build Windows
        shell: bash
        run: |
          VERSION=${{ needs.get_version.outputs.version }}
          wails build -platform windows/amd64 \
          -ldflags "-X github.com/ElJoker63/ipa-downloader/v2/pkg/version.Version=$VERSION -X github.com/ElJoker63/ipa-downloader/v2/pkg/version.Commit=$GITHUB_SHA" \
          -o ipa-downloader-$VERSION-windows.exe
      - name: Release Windows
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/ipa-downloader-*-windows.exe

  build-macos:
    name: Build for macOS
    runs-on: macos-latest
    needs: get_version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build macOS (Universal)
        run: |
          VERSION=${{ needs.get_version.outputs.version }}
          wails build -platform darwin/universal \
          -ldflags "-X github.com/ElJoker63/ipa-downloader/v2/pkg/version.Version=$VERSION -X github.com/ElJoker63/ipa-downloader/v2/pkg/version.Commit=$GITHUB_SHA" \
          -o ipa-downloader-$VERSION-macos
      - name: Package macOS
        run: |
          VERSION=${{ needs.get_version.outputs.version }}
          cd build/bin
          zip -r ipa-downloader-$VERSION-macos.zip *.app
      - name: Release macOS
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/ipa-downloader-*-macos.zip

  build-linux:
    name: Build for Linux
    runs-on: ubuntu-latest
    needs: get_version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build Linux
        run: |
          VERSION=${{ needs.get_version.outputs.version }}
          wails build -platform linux/amd64 \
          -ldflags "-X github.com/ElJoker63/ipa-downloader/v2/pkg/version.Version=$VERSION -X github.com/ElJoker63/ipa-downloader/v2/pkg/version.Commit=$GITHUB_SHA" \
          -o ipa-downloader-$VERSION-linux
      - name: Release Linux
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/ipa-downloader-*-linux
