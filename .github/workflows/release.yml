name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  get_version:
    name: Get version
    runs-on: ubuntu-latest
    steps:
      - id: set_output
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION"
    outputs:
      version: ${{ steps.set_output.outputs.version }}

  build:
    name: Build Desktop
    runs-on: ${{ matrix.os }}
    needs: get_version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            suffix: .exe
            label: windows
          - os: macos-latest
            platform: darwin/universal
            suffix: ""
            label: macos
          - os: ubuntu-latest
            platform: linux/amd64
            suffix: ""
            label: linux
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build with Wails
        shell: bash
        run: |
          VERSION=${{ needs.get_version.outputs.version }}
          wails build -platform ${{ matrix.platform }} \
          -ldflags "-X github.com/ElJoker63/ipa-downloader/v2/pkg/version.Version=$VERSION -X github.com/ElJoker63/ipa-downloader/v2/pkg/version.Commit=$GITHUB_SHA" \
          -o ipa-downloader-$VERSION-${{ matrix.label }}${{ matrix.suffix }}

      - name: Package macOS (if universal)
        if: matrix.platform == 'darwin/universal'
        shell: bash
        run: |
          VERSION=${{ needs.get_version.outputs.version }}
          cd build/bin
          zip -r ipa-downloader-$VERSION-macos-universal.zip *.app
          # Remove the directory so it doesn't get uploaded as-is
          rm -rf *.app

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.get_version.outputs.version }}
          name: IPA Downloader v${{ needs.get_version.outputs.version }}
          files: |
            build/bin/ipa-downloader-*
          generate_release_notes: true
