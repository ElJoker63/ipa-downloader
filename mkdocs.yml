site_name: IPA Downloader
site_description: Aplicación de escritorio y suite CLI para buscar, descargar y realizar sideloading de paquetes de apps (.ipa) de la App Store de Apple.
site_author: UDYAT / ElJoker63
site_url: https://eljoker63.github.io/ipa-downloader/
repo_name: ElJoker63/ipa-downloader
repo_url: https://github.com/ElJoker63/ipa-downloader

theme:
  name: material
  language: es
  icon:
    logo: material/apple
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: slate
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
    - scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: es
          name: Español
          default: true
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            Inicio: Home
            Primeros Pasos: Getting Started
            Instalación: Installation
            Inicio Rápido: Quickstart
            Aplicación de Escritorio: Desktop Application
            Vista General: Overview
            Búsqueda y Descarga: Search & Download
            Gestor USB y Sideloading: USB Manager & Sideloading
            Biblioteca y Compras: Library & Purchases
            Explorador de Firmwares IPSW: IPSW Firmware Browser
            Modo CLI: CLI Mode
            Visión General: Overview
            Referencia de Comandos: Command Reference
            Arquitectura y Seguridad: Architecture & Security
            Arquitectura del Sistema: System Architecture
            Protocolo App Store y FairPlay: App Store Protocol & FairPlay
            Solución de Problemas: Troubleshooting
            macOS (Gatekeeper y Cuarentena): macOS (Gatekeeper & Quarantine)
            Windows y Linux: Windows & Linux
            Desarrollo: Development
            Compilación desde el Código: Building from Source
            Guía de Contribución: Contributing Guide

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Inicio: index.md
  - Primeros Pasos:
      - Instalación: getting-started/installation.md
      - Inicio Rápido: getting-started/quickstart.md
  - Aplicación de Escritorio:
      - Vista General: desktop/overview.md
      - Búsqueda y Descarga: desktop/search-and-download.md
      - Gestor USB y Sideloading: desktop/devices.md
      - Biblioteca y Compras: desktop/library.md
      - Explorador de Firmwares IPSW: desktop/firmware.md
  - Modo CLI:
      - Visión General: cli/overview.md
      - Referencia de Comandos: cli/commands.md
  - Arquitectura y Seguridad:
      - Arquitectura del Sistema: architecture/architecture.md
      - Protocolo App Store y FairPlay: architecture/protocol.md
  - Solución de Problemas:
      - macOS (Gatekeeper y Cuarentena): troubleshooting/macos.md
      - Windows y Linux: troubleshooting/others.md
  - Desarrollo:
      - Compilación desde el Código: development/build.md
      - Guía de Contribución: development/contributing.md
